# BioF3 Local — Electron Builder 配置

appId: com.biof3.local
productName: BioF3
copyright: Copyright © 2026 BioF3

directories:
  output: dist
  buildResources: resources

# M2-11 (H4)：签名后 notarize + staple（需 CI 注入 APPLE_ID/APP_PASSWORD/NOTARIZE_TEAM_ID）
afterSign: build/afterSign.js

# 打包进 Electron app bundle 的文件
files:
  - src/**/*
  - package.json
  - "!**/.DS_Store"

# macOS 特定
mac:
  category: public.app-category.education
  icon: icons/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: true
  # M2-11 (H4)：mac 签名 + notarization
  # 有证书时：CI 注入 CSC_LINK/CSC_KEY_PASSWORD → identity 自动匹配
  # 无证书时：identity: null，用户需右键打开（v1 过渡）
  identity: null
  notarize:
    teamId: ${NOTARIZE_TEAM_ID}
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# Windows 特定
win:
  icon: icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装器配置
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BioF3

# 压缩
compression: maximum

# 自动更新发布源（占位 — 发布时填实际 URL）
# publish:
#   provider: generic
#   url: https://biof3-updates.oss-cn-hangzhou.aliyuncs.com/desktop/mac/
# 或 GitHub Releases:
#   provider: github
#   owner: ShengXinF3
#   repo: BioF3

# 额外资源：r-server / py-server / shared-backend / 前端 build 产物 / 内置插件
# r-server 和 py-server 作为子进程 spawn，需要带上各自的 node_modules
#
# 阶段 3（desktop-spa）：前端 build 产物改为 Vite SPA（frontend/dist）
# Docusaurus build 仍保留（docs/blog iframe 过渡，阶段 2 后移除）
#
# R/Python Runtime 已移除 — 改为插件商店按需下载（~200MB 初始包）
# 打包脚本: scripts/build-runtime-plugins.sh → 上传 OSS → manifest.json 注册
# 用户首次启动后在插件商店下载 R/Python Runtime 到 ~/Documents/BioF3-Local/runtimes/
extraResources:
  # 断点5：core 仓作为 git submodule 在 vendor/biof3-core/
  # 打包时把 core 的 r-server/py-server/shared-backend 复制到 resources/core/
  - from: ./vendor/biof3-core/r-server
    to: core/r-server
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!**/*.log"
      - "!**/test*"
  - from: ./vendor/biof3-core/py-server
    to: core/py-server
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!**/*.log"
      - "!**/test*"
  - from: ./vendor/biof3-core/shared-backend
    to: core/shared-backend
    filter:
      - "**/*"
      - "!**/.DS_Store"
  # Vite SPA build 产物 — 主窗口加载
  - from: ./frontend/dist
    to: frontend/dist
    filter:
      - "**/*"
      - "!**/.DS_Store"
  # 内置插件（插件商店默认可用，无需联网）
  - from: ./resources/built-in-plugins
    to: built-in-plugins
    filter:
      - "**/*"
      - "!**/.DS_Store"
  # fix-r-paths.sh — R Runtime 安装时调用（修正 dylib 路径）
  - from: ./scripts/fix-r-paths.sh
    to: scripts/fix-r-paths.sh
