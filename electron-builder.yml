# Petri Local — Electron Builder 配置

appId: com.petri.local
productName: Petri
copyright: Copyright © 2026 Petri

directories:
  output: dist
  buildResources: resources

# M2-11 (H4)：签名后 notarize + staple（需 CI 注入 APPLE_ID/APP_PASSWORD/NOTARIZE_TEAM_ID）
# 顶层 afterSign 仅作为冗余保险；mac: 段下也声明了一次（electron-builder 双读）
afterSign: build/afterSign.js
afterPack: build/afterPack.js

# 打包进 Electron app bundle 的文件
files:
  - src/**/*
  - package.json
  - "!**/.DS_Store"

# macOS 特定
mac:
  category: public.app-category.education
  icon: icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
  # M2-11 (H4)：mac 签名 + notarization
  # 有证书时：CI 注入 CSC_LINK/CSC_KEY_PASSWORD → identity 自动匹配
  # 无证书时：identity: null，用户需右键打开（v1 过渡）
  identity: ${CSC_NAME:-null}
  # 使用 build/afterSign.js hook 走 notarytool；关闭 electron-builder 内置 notarize 避免双提交
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# Windows 特定
win:
  icon: icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装器配置
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Petri

# 压缩
compression: maximum

# 小团队更新发布源 — 阿里云 OSS macOS 渠道
# 客户端读取 latest-mac.yml，下载匹配架构的 DMG 并校验 SHA-512。
# latest-mac.yml 必须最后上传并禁用缓存；带版本号的 DMG 可长期缓存。
# GitHub Release 继续作为手动下载镜像，不再作为应用内更新源。
publish:
  provider: generic
  url: https://petri-uploads.oss-cn-hangzhou.aliyuncs.com/desktop/updates/macos
  channel: latest

# 额外资源：petri-server / shared-backend / 前端 build 产物 / 内置插件
# petri-server 作为子进程 spawn，需要带上各自的 node_modules
# （BLOCK-30 P1：独立 Python 后端已摘除，Python 工具由 petri-server 经执行器本地执行）
#
# 阶段 3（desktop-spa）：前端 build 产物改为 Vite SPA（frontend/dist）
# Docusaurus build 仍保留（docs/blog iframe 过渡，阶段 2 后移除）
#
# R/Python Runtime 已移除 — 改为插件商店按需下载（~200MB 初始包）
# 打包脚本: scripts/build-runtime-plugins.sh → 上传 OSS → manifest.json 注册
# 用户首次启动后在插件商店下载 R/Python Runtime 到 ~/Documents/Petri-Local/runtimes/
extraResources:
  # 去 submodule 后：core 内嵌在 desktop 仓根 core/ 下
  # 打包时把 core 的 petri-server/shared-backend 复制到 resources/core/
  - from: ./core/petri-server
    to: core/petri-server
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!**/*.log"
      - "!**/test*"
  - from: ./core/shared-backend
    to: core/shared-backend
    filter:
      - "**/*"
      - "!**/.DS_Store"
  # Vite SPA build 产物 — 主窗口加载
  - from: ./frontend/dist
    to: frontend/dist
    filter:
      - "**/*"
      - "!**/.DS_Store"
  # BLOCK-163 W3 P12（DIST-4）— resources/skills 纳入 extraResources：
  # 修打包态内置技能供给断链（BUILT_IN_SKILLS_DIR 解析 <Resources>/skills）
  - from: ./resources/skills
    to: skills
    filter:
      - "**/*"
      - "!**/.DS_Store"
  # BLOCK-163 W3 P12（DIST-4）— 原「内置插件」extraResources 退役：目录已在
  # BLOCK-83 P4 从树中删除（electron-builder.yml 曾保留陈旧引用），此处一并清偿；
  # 领域插件分发 = 领域包通道（pack:install-from-dialog/install-path）。
  # fix-r-paths.mjs + shell helper — R Runtime 安装时调用（修正 dylib 路径）
  - from: ./scripts/fix-r-paths.mjs
    to: scripts/fix-r-paths.mjs
  - from: ./scripts/fix-r-paths.sh
    to: scripts/fix-r-paths.sh
