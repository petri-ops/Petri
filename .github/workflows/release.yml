name: desktop-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.1-rc.1). Leave blank to use current ref name.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # macOS: arm64 + x64 dmg, signed + notarized (when CSC_* / APPLE_* secrets present)
  macos:
    name: macOS dmg (arm64 + x64)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # BioF3 core submodule lives at ShengXinF3/BioF3 (private).
          # Default GITHUB_TOKEN does not cross repo boundaries, so a
          # PAT with `repo` scope must be supplied via SUBMODULE_TOKEN.
          #
          # Graceful degradation: when SUBMODULE_TOKEN is missing we still
          # attempt the checkout with GITHUB_TOKEN. The 401 from the private
          # submodule surfaces as a warning instead of a hard failure so the
          # build steps below can decide whether to proceed.
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Diagnose submodule availability
        # If the private Core submodule failed to fetch above, surface a
        # single clear warning so the operator knows to set SUBMODULE_TOKEN
        # instead of staring at a generic 401 later. We do NOT fail the job
        # here so that build/upload steps can still produce evidence.
        shell: bash
        run: |
          if git submodule status vendor/biof3-core | grep -q '^-'; then
            echo "::warning::vendor/biof3-core submodule is NOT initialized."
            echo "::warning::Set repository Secret SUBMODULE_TOKEN (PAT with 'repo' scope)"
            echo "::warning::to enable cross-repo submodule fetch in CI."
          else
            echo "[submodule] vendor/biof3-core OK at $(git -C vendor/biof3-core rev-parse HEAD)"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Stub @docusaurus/tsconfig for submodule tsconfig extends
        shell: bash
        run: mkdir -p vendor/biof3-core/node_modules/@docusaurus/tsconfig && cp frontend/scripts/stubs/docusaurus-tsconfig/tsconfig.json vendor/biof3-core/node_modules/@docusaurus/tsconfig/tsconfig.json

      - name: Verify pinned core and manifests
        shell: bash
        run: |
          bash scripts/sync-vendor.sh check
          npm run harness:check

      - name: Build macOS arm64 + x64 DMG
        env:
          # mac signing identity; non-null enables Developer ID signing
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          # mac notarization credentials
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
          # GH token (for build:site echo only, but kept consistent)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:mac-arm64
          npm run build:mac-x64

      - name: Compute SHA-256 for mac artifacts
        shell: bash
        run: |
          set +e
          shasum -a 256 dist/*.dmg dist/*.zip dist/*.yml 2>/dev/null > dist/SHA256SUMS-mac.txt
          if [ ! -s dist/SHA256SUMS-mac.txt ]; then
            shasum -a 256 dist/*.dmg > dist/SHA256SUMS-mac.txt || true
          fi
          cat dist/SHA256SUMS-mac.txt

      - name: Upload mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/SHA256SUMS-mac.txt

  # Windows: x64 NSIS installer, code signed (when CSC_LINK secret present)
  windows:
    name: Windows NSIS (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # BioF3 core submodule lives at ShengXinF3/BioF3 (private).
          # Graceful degradation: see the macOS job's Diagnose submodule
          # step above — same fallback strategy applies here.
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Diagnose submodule availability
        shell: bash
        run: |
          if git submodule status vendor/biof3-core | grep -q '^-'; then
            echo "::warning::vendor/biof3-core submodule is NOT initialized."
            echo "::warning::Set repository Secret SUBMODULE_TOKEN (PAT with 'repo' scope)"
            echo "::warning::to enable cross-repo submodule fetch in CI."
          else
            echo "[submodule] vendor/biof3-core OK at $(git -C vendor/biof3-core rev-parse HEAD)"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Stub @docusaurus/tsconfig for submodule tsconfig extends
        shell: bash
        run: mkdir -p vendor/biof3-core/node_modules/@docusaurus/tsconfig && cp frontend/scripts/stubs/docusaurus-tsconfig/tsconfig.json vendor/biof3-core/node_modules/@docusaurus/tsconfig/tsconfig.json

      - name: Verify pinned core and manifests
        shell: bash
        run: |
          bash scripts/sync-vendor.sh check
          npm run harness:check

      - name: Build Windows NSIS x64
        env:
          # Windows code signing (base64 .pfx in CSC_LINK)
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:win

      - name: Compute SHA-256 for windows artifacts
        shell: bash
        run: shasum -a 256 dist/*.exe > dist/SHA256SUMS-win.txt

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS-win.txt

  # Aggregate artifacts and create / update GitHub prerelease
  release:
    name: Publish GitHub prerelease
    needs: [macos, windows]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: artifacts/windows

      - name: Combine SHA-256 sums
        shell: bash
        run: |
          cat artifacts/macos/SHA256SUMS-mac.txt artifacts/windows/SHA256SUMS-win.txt \
            | sort -k 2 > artifacts/SHA256SUMS.txt
          echo "----- Combined SHA256SUMS -----"
          cat artifacts/SHA256SUMS.txt

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ contains(steps.tag.outputs.name, '-rc') || contains(steps.tag.outputs.name, '-beta') || contains(steps.tag.outputs.name, '-alpha') }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/macos/*
            artifacts/windows/*
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}