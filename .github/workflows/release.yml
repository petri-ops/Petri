name: desktop-release-macos

# Local macOS builds uploaded with `gh release` are the default release path.
# This manual workflow is only an optional fallback when Actions minutes exist.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'macOS release tag (for example v0.0.1-rc.2)'
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: Build and publish macOS arm64 + x64
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          mkdir -p vendor/biof3-core/node_modules/@docusaurus/tsconfig
          cp frontend/scripts/stubs/docusaurus-tsconfig/tsconfig.json vendor/biof3-core/node_modules/@docusaurus/tsconfig/tsconfig.json

      - name: Verify source and manifests
        run: npm run check

      - name: Build macOS arm64 + x64 DMG
        env:
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
        run: npm run build:mac

      - name: Compute SHA-256
        run: shasum -a 256 dist/*.dmg > dist/SHA256SUMS-mac.txt

      - name: Publish macOS prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ contains(inputs.tag, '-rc') || contains(inputs.tag, '-beta') || contains(inputs.tag, '-alpha') }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/SHA256SUMS-mac.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
