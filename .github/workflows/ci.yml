name: desktop-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stability:
    # Petri Desktop releases are macOS-only from v0.0.1-rc.2 onward.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run platform regressions
        run: >-
          node --test
          test/platform-compat.test.mjs
          test/migration-runner.test.mjs
          test/artifact-truth.test.mjs
          test/harness-file-index.test.mjs
          test/mcp-tool-registry.test.mjs

      - name: Run Phase 7 Harness quality gate
        run: npm run harness:phase7

      - name: Check frontend and build SPA
        run: |
          npm --prefix frontend run check
          npm --prefix frontend test -- useResizableColumns.test.ts result-manifest.test.ts
          npm run build:spa
