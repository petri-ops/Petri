<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Petri 顶栏对比 · 现状自绘 vs 案A原生（非实现）</title>
<style>
  :root{
    --petri-bg-canvas:#f7f7f8; --petri-bg-surface:#fff; --petri-bg-subtle:#f4f4f5;
    --petri-text:#18181b; --petri-text-secondary:#52525b; --petri-text-muted:#a1a1aa;
    --petri-border:#e4e4e7; --petri-accent:#3f6f8f; --petri-accent-bg:color-mix(in srgb,var(--petri-accent) 10%,transparent);
    --petri-radius-md:8px; --petri-font-size-lg:16px; --petri-font-size-body:14px; --petri-font-size-sm:12px; --petri-font-size-xs:11px;
  }
  html[data-theme='dark']{
    --petri-bg-canvas:#0b1220; --petri-bg-surface:#111a2e; --petri-bg-subtle:#182339;
    --petri-text:#e6edf3; --petri-text-secondary:#9aa7b8; --petri-text-muted:#6b7689;
    --petri-border:#243149; --petri-accent:#5fa8d3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--petri-bg-canvas);color:var(--petri-text);font:var(--petri-font-size-body)/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}
  header{position:sticky;top:0;background:var(--petri-bg-surface);border-bottom:1px solid var(--petri-border);padding:12px 24px;z-index:2}
  header h1{font-size:var(--petri-font-size-lg);margin:0 0 2px}
  header p{margin:0;color:var(--petri-text-secondary);font-size:var(--petri-font-size-sm)}
  .toolbar{position:sticky;top:62px;background:var(--petri-bg-surface);padding:8px 24px;border-bottom:1px solid var(--petri-border)}
  .toolbar button{font:inherit;font-size:var(--petri-font-size-sm);padding:5px 12px;border:1px solid var(--petri-border);border-radius:6px;background:var(--petri-bg-subtle);color:var(--petri-text);cursor:pointer}
  main{max-width:1040px;margin:0 auto;padding:24px}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .pane{background:var(--petri-bg-surface);border:1px solid var(--petri-border);border-radius:var(--petri-radius-md);overflow:hidden}
  .pane>figcaption{padding:7px 12px;background:var(--petri-bg-subtle);font-size:var(--petri-font-size-sm);color:var(--petri-text-secondary)}
  .pane.proposal>figcaption{color:var(--petri-accent);font-weight:600}
  .mock{background:var(--petri-bg-canvas);padding:14px;min-height:230px}
  .win{border:1px solid var(--petri-border);border-radius:9px;background:var(--petri-bg-surface);overflow:hidden;min-height:196px}
  .bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--petri-border);background:var(--petri-bg-surface)}
  .lights{display:flex;gap:6px}
  .light{width:11px;height:11px;border-radius:50%;background:var(--petri-border)}
  .light.close{background:#e06c5b}.light.min{background:#e0b34b}.light.max{background:#5fb86a}
  .glyph{font-size:10px;color:var(--petri-text-muted);line-height:1;margin-top:1px}
  .dots{display:flex;gap:5px}.dot{width:10px;height:10px;border-radius:50%;background:#ff5f57;border:1px solid rgba(0,0,0,.12)}
  .dot.y{background:#febc2e}.dot.g{background:#28c840}
  .title{flex:1;text-align:center;font-size:var(--petri-font-size-sm);color:var(--petri-text-secondary)}
  .chrome{display:flex;align-items:center;gap:10px}
  .pill{font-size:var(--petri-font-size-xs);padding:2px 7px;border-radius:20px;background:var(--petri-accent-bg);color:var(--petri-accent)}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--petri-accent);color:#fff;font-size:10px}
  .row{display:flex;gap:8px;align-items:center;font-size:var(--petri-font-size-xs);color:var(--petri-text-muted)}
  .content{padding:14px;color:var(--petri-text-secondary);font-size:var(--petri-font-size-sm)}
  .cap{font-size:var(--petri-font-size-xs);color:var(--petri-text-muted);padding:4px 12px 10px}
  .native-title{height:28px;background:var(--petri-bg-subtle);border-bottom:1px solid var(--petri-border);display:flex;align-items:center;padding:0 10px;font-size:var(--petri-font-size-xs);color:var(--petri-text-secondary)}
  footer{color:var(--petri-text-muted);font-size:var(--petri-font-size-sm);padding:16px 24px;border-top:1px solid var(--petri-border)}
  @media(max-width:860px){.cmp{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>顶栏对比 · 现状自绘（B）vs 恢复原生（A）</h1>
  <p>静态提案稿、非实现；案A的自定义元素落位为 seat 建议，需 owner 二次裁决。</p>
</header>
<div class="toolbar"><button type="button" onclick="document.documentElement.removeAttribute('data-theme')">亮色</button><button type="button" onclick="document.documentElement.setAttribute('data-theme','dark')">暗色</button></div>
<main>
<section class="cmp">
  <figure class="pane"><figcaption>现状 B · 自绘顶栏（UI-120）</figcaption><div class="mock">
    <div class="win"><div class="bar">
      <div class="lights"><span class="light close"><span class="glyph">×</span></span><span class="light min"><span class="glyph">−</span></span><span class="light max"><span class="glyph">□</span></span></div>
      <div class="title">Petri · 项目工作区</div>
      <div class="chrome"><span class="pill">通知 <span class="badge">3</span></span><span class="pill">更新</span><span class="pill">更多工具 ⋯</span></div>
    </div><div class="content">会话 / 工作区内容……</div></div>
  </div><p class="cap">自绘三按钮 + 拖动区 + 通知/更新/审阅徽章 + 更多工具菜单；视觉统一，但窗口控制是自定义状态机。</p></figure>
  <figure class="pane proposal"><figcaption>案 A · 原生顶栏（提案）</figcaption><div class="mock">
    <div class="win"><div class="native-title"><div class="dots"><span class="dot"></span><span class="dot y"></span><span class="dot g"></span></div><span class="title" style="margin-left:8px">Petri · 项目工作区</span></div>
      <div class="bar"><div class="title" style="text-align:left">内容区状态栏</div><div class="chrome"><span class="pill">通知 <span class="badge">3</span></span><span class="pill">更新</span></div></div>
      <div class="content">会话 / 工作区内容……</div></div>
  </div><p class="cap">OS 原生交通灯/全屏；铃铛+更新迁内容区状态栏，更多工具迁应用菜单/右栏——视觉回退需 owner 接受。</p></figure>
</section>
</main>
<footer>试用反馈同源评估（msg_58fcbd3c0f7f）· 零代码 · pending_user_ruling；依据 docs/ui-productization-audit.md:1615 UI-120 裁决与今日全屏两修复（855aff48d/1d420518a，均 main 进程状态机）。</footer>
</body>
</html>
