<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DESeq2 差异分析 — 结果解读报告 | BioF3</title>
  <style>
  :root {
    --text: #17201d;
    --muted: #5c6b64;
    --border: #dfe8e3;
    --surface: #f8faf9;
    --primary: #2e8555;
    --warn: #d97706;
    --info: #2563eb;
    --code-bg: #f4f7f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; color: var(--text); font: 14px/1.72 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif; }
  .report { max-width: 860px; padding: 40px 32px 60px; margin: 0 auto; margin-left: max(200px, calc(50% - 330px)); }
  .report.full { margin-left: auto; margin-right: auto; }
  .report-header { border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 32px; }
  .report-header .eyebrow { font-size: 12px; color: var(--primary); letter-spacing: 1px; margin-bottom: 8px; }
  .report-header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .report-header .meta { font-size: 12px; color: var(--muted); }
  h2 { font-size: 18px; font-weight: 600; margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  h3 { font-size: 15px; font-weight: 600; margin: 24px 0 10px; }
  p { margin: 0 0 12px; }
  ul, ol { margin: 0 0 12px; padding-left: 22px; }
  li { margin-bottom: 4px; }
  code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; font-size: 13px; }
  .status-badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; color: #fff; }
  .status-valid { background: var(--primary); }
  .status-warning { background: var(--warn); }
  .status-blocked { background: #dc2626; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
  .summary-card .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .summary-card .value { font-size: 20px; font-weight: 700; }
  .note { background: #fef3c7; border: 1px solid #fde68a; border-radius: 6px; padding: 12px 16px; margin: 16px 0; font-size: 13px; }
  .note.info { background: #eff6ff; border-color: #bfdbfe; }
  .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
<div class="report">
  <div class="report-header">
    <div class="eyebrow">BioF3 · Bulk RNA-seq</div>
    <h1>DESeq2 差异分析报告</h1>
    <div class="meta">Plugin: deseq2 v1.0.0 | <span class="status-badge status-valid">✓ VALID</span></div>
  </div>
  <p>此模板由 R 脚本在运行时填充实际内容。报告包含 DEG 结果摘要、MA plot、PCA、dispersion 估计图。</p>
  <div class="footer">Generated by BioF3 deseq2 | R: runtime</div>
</div>
</body>
</html>
