<!-- PETRI 模板 · bar（分类柱状图）——BLOCK-174 CP-12
     用法：把 data 数组替换为真实数据（来源：petri.getData(jobId) 或模型内嵌），
     系列名/单位按需改；主题变量已接入（--primary/--muted/--foreground 自动跟随明暗与 accent）。 -->
<div style="font-family:system-ui,sans-serif;padding:16px">
  <h3 style="margin:0 0 4px;font-size:15px;color:var(--foreground)">图表标题（替换我）</h3>
  <p style="margin:0 0 14px;font-size:12px;color:var(--muted)">副标题/单位说明</p>
  <div id="bars" style="display:flex;flex-direction:column;gap:10px"></div>
  <script>
    (function () {
      var data = [
        ['分类 A', 42],
        ['分类 B', 78],
        ['分类 C', 55]
      ];
      var unit = '条';
      var max = Math.max.apply(null, data.map(function (d) { return d[1]; })) || 1;
      var host = document.getElementById('bars');
      data.forEach(function (d) {
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:10px';
        var label = document.createElement('span');
        label.textContent = d[0];
        label.style.cssText = 'width:120px;color:var(--muted-foreground);font-size:12px';
        var track = document.createElement('div');
        track.style.cssText = 'flex:1;height:18px;border-radius:9px;background:var(--muted)';
        var fill = document.createElement('div');
        fill.style.cssText = 'height:18px;border-radius:9px;background:var(--primary);width:' + Math.round((d[1] / max) * 100) + '%';
        var value = document.createElement('span');
        value.textContent = d[1] + ' ' + unit;
        value.style.cssText = 'width:56px;text-align:right;font-size:12px;color:var(--foreground)';
        track.appendChild(fill);
        row.appendChild(label); row.appendChild(track); row.appendChild(value);
        host.appendChild(row);
      });
    })();
  </script>
</div>
