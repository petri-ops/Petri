<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(125% 100% at 50% 0%, #f0f9fd 0%, #dbe9f2 48%, #c6d6e2 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  .stage {
    width: min(96vw, calc(88vh * 1.4516), 960px);
    filter: drop-shadow(0 22px 34px rgba(30, 58, 78, 0.18));
  }
  .stage svg { display: block; width: 100%; height: auto; }

  /* 云朵缓慢漂移 */
  .cloud { animation: drift 26s linear infinite; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-150px); }
  }

  /* 地面虚线向左流动，表现前进感 */
  .ground-flow { animation: groundFlow 0.85s linear infinite; }
  @keyframes groundFlow { to { stroke-dashoffset: -76; } }

  /* 链条流动 */
  .chain-line { animation: chainRun 0.45s linear infinite; }
  @keyframes chainRun { to { stroke-dashoffset: -9; } }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .ground-flow, .chain-line { animation: none; }
  }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车向前行进">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6fb"/>
      <stop offset="0.55" stop-color="#f5f9f6"/>
      <stop offset="1" stop-color="#fdf6ea"/>
    </linearGradient>
    <radialGradient id="groundGrad" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#e9e1d2"/>
      <stop offset="1" stop-color="#d8cdb8"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.6" stop-color="#f7f1e4"/>
      <stop offset="1" stop-color="#e6ddca"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0.05" y1="0.1" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fdfaf3"/>
      <stop offset="1" stop-color="#e5dcc8"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#f4b757"/>
      <stop offset="1" stop-color="#dc8e2f"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0.15" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#fcdd97"/>
      <stop offset="1" stop-color="#efb156"/>
    </linearGradient>
    <clipPath id="cardClip"><rect width="900" height="620" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">

    <!-- ===== 背景 ===== -->
    <rect width="900" height="620" fill="url(#skyGrad)"/>

    <g class="cloud" opacity="0.9">
      <ellipse cx="150" cy="112" rx="54" ry="22" fill="#ffffff"/>
      <ellipse cx="196" cy="99"  rx="40" ry="26" fill="#ffffff"/>
      <ellipse cx="106" cy="101" rx="32" ry="18" fill="#ffffff"/>
    </g>
    <g class="cloud" opacity="0.72" style="animation-duration:34s; animation-delay:-9s">
      <ellipse cx="748" cy="88" rx="60" ry="24" fill="#ffffff"/>
      <ellipse cx="798" cy="76" rx="38" ry="24" fill="#ffffff"/>
      <ellipse cx="702" cy="80" rx="30" ry="16" fill="#ffffff"/>
    </g>

    <rect x="0" y="530" width="900" height="90" fill="url(#groundGrad)"/>
    <line x1="0" y1="530" x2="900" y2="530" stroke="#cdc1ab" stroke-width="2"/>
    <line class="ground-flow" x1="-40" y1="560" x2="940" y2="560"
          stroke="#cfc3ac" stroke-width="5" stroke-dasharray="46 30" stroke-linecap="round"/>

    <ellipse cx="252" cy="534" rx="72" ry="8" fill="#7c6c52" opacity="0.16"/>
    <ellipse cx="628" cy="534" rx="72" ry="8" fill="#7c6c52" opacity="0.16"/>

    <!-- ===== 车轮 ===== -->
    <g id="wheelRear" transform="translate(252,442)">
      <circle r="88" fill="none" stroke="#232a31" stroke-width="11"/>
      <circle r="76" fill="none" stroke="#aab6c2" stroke-width="4"/>
      <g class="spokes"></g>
      <circle r="13" fill="#5c6a78"/>
      <circle r="5.5" fill="#333d47"/>
    </g>
    <g id="wheelFront" transform="translate(628,442)">
      <circle r="88" fill="none" stroke="#232a31" stroke-width="11"/>
      <circle r="76" fill="none" stroke="#aab6c2" stroke-width="4"/>
      <g class="spokes"></g>
      <circle r="13" fill="#5c6a78"/>
      <circle r="5.5" fill="#333d47"/>
    </g>

    <!-- ===== 链条（远侧） ===== -->
    <g id="chain">
      <path class="chain-line" d="M 432,420 L 252,429" fill="none" stroke="#6f7a85"
            stroke-width="4.5" stroke-linecap="round" stroke-dasharray="5 4"/>
      <path class="chain-line" d="M 432,476 L 252,455" fill="none" stroke="#6f7a85"
            stroke-width="4.5" stroke-linecap="round" stroke-dasharray="5 4"/>
      <path d="M 252,429 A 13,13 0 0 0 252,455" fill="none" stroke="#6f7a85" stroke-width="4.5"/>
      <circle cx="252" cy="442" r="13" fill="none" stroke="#6f7a85" stroke-width="3.5"/>
    </g>

    <!-- ===== 车架 ===== -->
    <g id="frame">
      <line x1="432" y1="448" x2="252" y2="442" stroke="#2f6f92" stroke-width="8"  stroke-linecap="round"/>
      <line x1="358" y1="296" x2="252" y2="442" stroke="#2f6f92" stroke-width="7"  stroke-linecap="round"/>
      <line x1="358" y1="296" x2="432" y2="448" stroke="#2f6f92" stroke-width="8"  stroke-linecap="round"/>
      <line x1="358" y1="296" x2="588" y2="290" stroke="#2f6f92" stroke-width="8"  stroke-linecap="round"/>
      <line x1="432" y1="448" x2="602" y2="344" stroke="#2f6f92" stroke-width="9"  stroke-linecap="round"/>
      <line x1="588" y1="290" x2="602" y2="344" stroke="#2f6f92" stroke-width="10" stroke-linecap="round"/>
      <line x1="602" y1="344" x2="628" y2="442" stroke="#2f6f92" stroke-width="8"  stroke-linecap="round"/>

      <!-- 座管 -->
      <line x1="358" y1="296" x2="356" y2="280" stroke="#7d8794" stroke-width="8" stroke-linecap="round"/>
      <!-- 车座：鞍形，前端长而收窄，明显露在鸟身之外 -->
      <path d="M 300,292 C 314,281 356,277 394,281 C 408,283 414,289 408,294 C 382,300 338,300 300,292 Z"
            fill="#31383f" stroke="#232a30" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 314,285 C 338,280 368,280 390,283" fill="none" stroke="#4d565e"
            stroke-width="2.2" stroke-linecap="round"/>

      <!-- 车把（与头管顶端共点连接） -->
      <circle cx="588" cy="290" r="5.5" fill="#7d8794"/>
      <path d="M 588,290 L 592,272 Q 594,264 586,264 L 548,262"
            fill="none" stroke="#7d8794" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 586,264 L 622,262 Q 630,262 628,270"
            fill="none" stroke="#7d8794" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="548" y1="262" x2="568" y2="263" stroke="#31383f" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- ===== 牙盘 ===== -->
    <g id="chainring">
      <circle cx="432" cy="448" r="28" fill="none" stroke="#7d8a97" stroke-width="5"/>
      <circle cx="432" cy="448" r="31" fill="none" stroke="#7d8a97" stroke-width="5"
              stroke-dasharray="4 4.5" opacity="0.85"/>
      <circle cx="432" cy="448" r="21" fill="none" stroke="#93a0ac" stroke-width="2" opacity="0.7"/>
    </g>

    <!-- ===== 远侧腿：暗色，压在牙盘之上，避免与齿轮链条混线 ===== -->
    <g id="crankFar">
      <line x1="0" y1="0" x2="32" y2="0" stroke="#6a7580" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g id="pedalFar">
      <rect x="-18" y="-5" width="36" height="10" rx="4" fill="#545d66" stroke="#9aa3ac" stroke-width="1.6"/>
    </g>
    <g id="legFar">
      <path class="thigh" d="" fill="none" stroke="#d6c9b0" stroke-width="27" stroke-linecap="round"/>
      <path class="shin"  d="" fill="none" stroke="#b07a2e" stroke-width="12" stroke-linecap="round"/>
      <g class="foot">
        <path d="M -14,-7 L 5,-8 L 9,-6 L 14,-7 L 20,-3.5 L 14,0 L -12,-1 Z" fill="#c98733" stroke="#7c5219" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M 4,-7.4 L 5,-1" stroke="#8a5a1c" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M 13,-6.6 L 13,-1" stroke="#8a5a1c" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ===== 近侧：曲柄 / 踏板 / 腿 ===== -->
    <g id="crankNear">
      <line x1="0" y1="0" x2="32" y2="0" stroke="#3b444d" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g id="pedalNear">
      <rect x="-18" y="-5" width="36" height="10" rx="4" fill="#3d474f" stroke="#2a3238" stroke-width="1.4"/>
    </g>
    <g id="legNear">
      <path class="thigh" d="" fill="none" stroke="#f0e8d8" stroke-width="30" stroke-linecap="round"/>
      <path class="shin"  d="" fill="none" stroke="#e8a94b" stroke-width="13" stroke-linecap="round"/>
      <g class="foot">
        <path d="M -14,-7 L 5,-8 L 9,-6 L 14,-7 L 20,-3.5 L 14,0 L -12,-1 Z" fill="#e9a13b" stroke="#b06f1c" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M 4,-7.4 L 5,-1" stroke="#c07d24" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M 13,-6.6 L 13,-1" stroke="#c07d24" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <g id="pelican">

      <!-- 尾羽 -->
      <path d="M 246,250 L 192,230 L 209,256 L 186,259 L 211,273 L 246,270 Z"
            fill="#efe7d6" stroke="#dbd0ba" stroke-width="2" stroke-linejoin="round"/>

      <!-- 脖子 -->
      <path d="M 382,214 C 396,176 412,150 444,136" fill="none" stroke="#f8f3e7"
            stroke-width="35" stroke-linecap="round"/>

      <!-- 身体：前倾抬胸，臀部压在车座后段 -->
      <ellipse cx="318" cy="240" rx="86" ry="56" transform="rotate(-8 318 240)"
               fill="url(#bodyGrad)" stroke="#dfd4c0" stroke-width="2.5"/>
      <ellipse cx="326" cy="252" rx="58" ry="30" transform="rotate(-8 326 252)"
               fill="#efe7d6" opacity="0.5"/>

      <!-- 头部 -->
      <g id="headGroup">
        <path d="M 446,90 C 452,78 464,73 474,78" fill="none" stroke="#e8dcc6"
              stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="462" cy="122" rx="36" ry="32" transform="rotate(-8 462 122)"
                 fill="#faf6ec" stroke="#ddd1bd" stroke-width="2"/>
        <ellipse cx="476" cy="110" rx="13" ry="11" fill="#f6d9a8" opacity="0.85"/>
        <circle cx="477" cy="110" r="8" fill="#ffffff"/>
        <circle cx="478.5" cy="110" r="4.6" fill="#25292e"/>
        <circle cx="480.5" cy="108" r="1.6" fill="#ffffff"/>
      </g>

      <!-- 上喙 -->
      <path d="M 486,104 C 536,110 596,132 642,146 C 650,148 650,155 641,155 C 592,148 528,132 484,120 Z"
            fill="url(#beakGrad)" stroke="#c8822a" stroke-width="2" stroke-linejoin="round"/>

      <!-- 喉咙囊 -->
      <g id="pouchGroup">
        <path d="M 484,122 C 528,134 582,146 636,154 C 618,186 576,208 536,204 C 508,201 490,180 478,152 C 472,138 476,128 484,122 Z"
              fill="url(#pouchGrad)" stroke="#d9a75a" stroke-width="2" stroke-linejoin="round"/>
        <path d="M 512,140 C 540,152 570,168 586,190" fill="none" stroke="#e3ac5c"
              stroke-width="1.6" opacity="0.7" stroke-linecap="round"/>
        <path d="M 500,148 C 528,164 552,180 562,200" fill="none" stroke="#e3ac5c"
              stroke-width="1.6" opacity="0.7" stroke-linecap="round"/>
      </g>

      <!-- 翅膀：搭在车把上 -->
      <path d="M 334,206 C 394,204 466,226 516,244 C 540,252 554,255 564,259
               C 566,267 557,275 547,272 C 509,265 466,256 432,252
               C 398,248 362,248 340,250 C 326,250 324,228 332,214 Z"
            fill="url(#wingGrad)"/>
      <path d="M 332,214 C 394,204 466,226 516,244 C 540,252 554,255 564,259
               C 566,267 557,275 547,272 C 509,265 466,256 432,252 C 398,248 362,248 340,252"
            fill="none" stroke="#d5c9b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 378,232 C 428,236 488,248 532,258" fill="none" stroke="#dbcfba"
            stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 372,244 C 424,248 482,256 526,264" fill="none" stroke="#dbcfba"
            stroke-width="1.8" stroke-linecap="round"/>
    </g>

  </g>
</svg>
</div>

<script>
(function () {
  'use strict';

  var SVGNS = 'http://www.w3.org/2000/svg';

  /* ---- 几何常量：与上面 SVG 中的静态坐标严格一致 ---- */
  var BB = { x: 432, y: 448 };      /* 中轴（曲柄中心） */
  var RA = { x: 252, y: 442 };      /* 后轮轴 */
  var FA = { x: 628, y: 442 };      /* 前轮轴 */
  var CRANK_R = 32;                 /* 曲柄半径 */
  var GEAR_RATIO = 2.15;            /* 牙盘 / 飞轮 传动比 */
  var THIGH = 106;                  /* 大腿长 */
  var SHIN = 106;                   /* 小腿长 */
  var HIP = { x: 366, y: 288 };     /* 髋部（坐在车座上） */
  var CRANK_PERIOD = 1.15;          /* 曲柄转一圈的秒数 */

  var el = function (id) { return document.getElementById(id); };

  var wheelRear = el('wheelRear');
  var wheelFront = el('wheelFront');
  var crankNear = el('crankNear');
  var crankFar = el('crankFar');
  var pedalNear = el('pedalNear');
  var pedalFar = el('pedalFar');
  var legNear = el('legNear');
  var legFar = el('legFar');
  var pelican = el('pelican');
  var pouchGroup = el('pouchGroup');

  /* ---- 生成辐条 ---- */
  function buildSpokes(group, count, hubR, rimR) {
    var step = (Math.PI * 2) / count;
    for (var i = 0; i < count; i++) {
      var a1 = i * step;
      var a2 = a1 + 0.17;                     /* 轻微编织角，更像真实编圈 */
      var line = document.createElementNS(SVGNS, 'line');
      line.setAttribute('x1', (hubR * Math.cos(a1)).toFixed(2));
      line.setAttribute('y1', (hubR * Math.sin(a1)).toFixed(2));
      line.setAttribute('x2', (rimR * Math.cos(a2)).toFixed(2));
      line.setAttribute('y2', (rimR * Math.sin(a2)).toFixed(2));
      line.setAttribute('stroke', '#b9c4d0');
      line.setAttribute('stroke-width', '2.1');
      line.setAttribute('stroke-linecap', 'round');
      group.appendChild(line);
    }
  }
  var spokeGroups = document.querySelectorAll('#wheelRear .spokes, #wheelFront .spokes');
  for (var s = 0; s < spokeGroups.length; s++) {
    buildSpokes(spokeGroups[s], 12, 13, 73);
  }

  /* ---- 两段式腿部逆运动学：由髋与脚的落点解出膝盖位置 ---- */
  function solveKnee(hip, foot, a, b) {
    var dx = foot.x - hip.x;
    var dy = foot.y - hip.y;
    var d = Math.sqrt(dx * dx + dy * dy);

    var dMax = a + b - 0.75;
    var dMin = Math.abs(a - b) + 0.75;
    if (d > dMax) { var k1 = dMax / d; dx *= k1; dy *= k1; d = dMax; }
    if (d < dMin) { var k2 = dMin / Math.max(d, 0.0001); dx *= k2; dy *= k2; d = dMin; }

    var base = Math.atan2(dy, dx);
    var cosA = (a * a + d * d - b * b) / (2 * a * d);
    var angA = Math.acos(Math.max(-1, Math.min(1, cosA)));

    var kneeA = {
      x: hip.x + a * Math.cos(base - angA),
      y: hip.y + a * Math.sin(base - angA)
    };
    var kneeB = {
      x: hip.x + a * Math.cos(base + angA),
      y: hip.y + a * Math.sin(base + angA)
    };
    /* 膝盖朝前（屏幕 +x 方向） */
    return (kneeA.x >= kneeB.x) ? kneeA : kneeB;
  }

  /* ---- 曲柄角度 -> 踏板位置（踏板本身始终水平） ---- */
  function pedalAt(angle) {
    return {
      x: BB.x + CRANK_R * Math.cos(angle),
      y: BB.y + CRANK_R * Math.sin(angle)
    };
  }

  function f1(n) { return n.toFixed(1); }

  function updateLeg(legGroup, pedalGroup, hip, pedal) {
    var knee = solveKnee(hip, pedal, THIGH, SHIN);

    legGroup.querySelector('.thigh').setAttribute('d',
      'M ' + f1(hip.x) + ' ' + f1(hip.y) + ' L ' + f1(knee.x) + ' ' + f1(knee.y));
    legGroup.querySelector('.shin').setAttribute('d',
      'M ' + f1(knee.x) + ' ' + f1(knee.y) + ' L ' + f1(pedal.x) + ' ' + f1(pedal.y));
    legGroup.querySelector('.foot').setAttribute('transform',
      'translate(' + f1(pedal.x) + ',' + f1(pedal.y - 6) + ')');
    pedalGroup.setAttribute('transform',
      'translate(' + f1(pedal.x) + ',' + f1(pedal.y) + ')');
  }

  /* ---- 每帧渲染 ---- */
  function render(theta) {
    /* 身体随踩踏轻微起伏：一圈踩踏起伏两次 */
    var bob = -2.6 * Math.sin(2 * theta);
    var sway = 1.2 * Math.cos(2 * theta + 0.4);

    /* 车轮：曲柄角 × 传动比 */
    var wheelDeg = (theta * GEAR_RATIO * 180 / Math.PI).toFixed(2);
    wheelRear.setAttribute('transform', 'translate(' + RA.x + ',' + RA.y + ') rotate(' + wheelDeg + ')');
    wheelFront.setAttribute('transform', 'translate(' + FA.x + ',' + FA.y + ') rotate(' + wheelDeg + ')');

    /* 两侧曲柄相差 180 度 */
    var nearAngle = theta;
    var farAngle = theta + Math.PI;

    crankNear.setAttribute('transform',
      'translate(' + BB.x + ',' + BB.y + ') rotate(' + (nearAngle * 180 / Math.PI).toFixed(2) + ')');
    crankFar.setAttribute('transform',
      'translate(' + BB.x + ',' + BB.y + ') rotate(' + (farAngle * 180 / Math.PI).toFixed(2) + ')');

    /* 髋部跟着身体起伏；远侧腿明显后错，让两条腿始终能分辨 */
    var hipNear = { x: HIP.x + sway, y: HIP.y + bob };
    var hipFar = { x: HIP.x + sway - 18, y: HIP.y + bob - 10 };

    updateLeg(legNear, pedalNear, hipNear, pedalAt(nearAngle));
    updateLeg(legFar, pedalFar, hipFar, pedalAt(farAngle));

    /* 整个鹈鹕随身体起伏 */
    pelican.setAttribute('transform',
      'translate(' + sway.toFixed(2) + ',' + bob.toFixed(2) + ')');

    /* 喉囊随节拍轻晃 */
    var swing = (1.6 * Math.sin(2 * theta + 0.9)).toFixed(2);
    pouchGroup.setAttribute('transform', 'rotate(' + swing + ' 486 132)');
  }

  /* ---- 主循环 ---- */
  var OMEGA = (Math.PI * 2) / CRANK_PERIOD;
  var theta = 0;
  var last = null;

  function tick(now) {
    if (last === null) { last = now; }
    var dt = Math.min((now - last) / 1000, 0.06);   /* 切页回来时不跳帧 */
    last = now;

    theta += OMEGA * dt;
    if (theta > Math.PI * 1000) { theta -= Math.PI * 1000; }

    render(theta);
    requestAnimationFrame(tick);
  }

  render(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
