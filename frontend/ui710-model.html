<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><title>UI-710 模型画面核对</title>
<style>
  body{background:#0b1220;color:#e6edf3;font-family:system-ui;margin:0;padding:24px}
  a{color:#5ac8d8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .card{border:1px solid #324466;border-radius:12px;background:#111a2e;padding:16px}
  #sceneHost{height:420px;background:#182339;border-radius:8px;overflow:hidden}
  #shot{width:100%;height:420px;object-fit:contain;background:#182339;border-radius:8px}
  pre{font-size:13px;color:#9aa7b8;white-space:pre-wrap}
</style></head>
<body>
  <a href="/ui710-fixture.html?v=5">← 返回证据核对卡</a>
  <h1>UI-710 · 3D 模型画面核对</h1>
  <div class="grid">
    <div class="card"><h2>实时 canvas</h2><div id="sceneHost"></div></div>
    <div class="card"><h2>渲染帧截图（capture API）</h2><img id="shot" alt="model frame" /><pre id="status">loading…</pre></div>
  </div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { Model3DScene } from '/src/components/work-surface/Model3DScene.tsx';

    let api = null;
    const url = 'http://localhost:3001/api/workspaces/p_mwnkhuj2_okzh/file?path=' + encodeURIComponent('model3d/runs/block463-live/model.glb');
    const status = document.getElementById('status');
    window.__ui710Status = { ready: null, error: null, captureLen: 0 };

    createRoot(document.getElementById('sceneHost')).render(
      React.createElement(Model3DScene, {
        view: null,
        viewAngle: 'iso',
        modelUrl: url,
        modelFormat: 'glb',
        active: true,
        onReady: (info) => { window.__ui710Status.ready = info; status.textContent = 'ready ' + JSON.stringify(info); },
        onError: (msg) => { window.__ui710Status.error = msg; status.textContent = 'error ' + msg; },
        onSnapshotApi: (next) => { api = next; },
      })
    );

    setTimeout(() => {
      const png = api?.capture?.() || null;
      window.__ui710Status.captureLen = png?.length || 0;
      if (png) document.getElementById('shot').src = png;
      status.textContent = 'capture len=' + (png?.length || 0) + ' ' + JSON.stringify(window.__ui710Status);
    }, 4000);
  </script>
</body>
</html>
