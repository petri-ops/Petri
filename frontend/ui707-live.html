<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI-707 · 模型行就地配置核对</title>
  <style>
    html,body,#root{min-height:100%;margin:0;background:#0b1220;color:#e6edf3;font-family:system-ui,sans-serif}
    #root{padding:20px 28px;box-sizing:border-box}
    h1{font-size:20px;margin:0 0 6px}.lead{font-size:13px;color:#9aa7b8;margin-bottom:14px;line-height:1.6}
    a{color:#5ac8d8;font-size:13px}.card{border:1px solid #324466;border-radius:12px;background:#111a2e;padding:16px;max-width:520px}
    pre{font-size:12px;color:#9aa7b8;white-space:pre-wrap}
  </style>
</head>
<body>
  <div id="root">
    <h1>UI-707 · 模型行悬停/聚焦就地配置</h1>
    <div class="lead">真实 ModelMenu 组件 + 受控 presets。聚焦模型行应展开上下文窗口/思考档配置；改一档只记录 patch，不写盘、不改任何持久配置。</div>
    <div><a href="/settings">→ 去看设置页（上下文列退役）</a></div>
    <div class="card" id="menuHost"></div>
    <h2>回调读数（不持久化）</h2>
    <pre id="patchLog">（未修改）</pre>
  </div>
  <script type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { ThemeProvider } from '/src/themes/ThemeProvider.tsx';
    import { ModelMenu } from '/src/components/copilot/SimpleChat/ModelMenu.tsx';
    import { buildModelGroups, EMPTY_MODEL_CATALOG } from '/src/lib/model-catalog.ts';

    const presets = [
      { id: 'p1::model-a', label: 'DeepSeek', provider: 'anthropic', model: 'model-a', endpointProfileId: 'p1', contextWindow: 64000, defaultThinkingLevel: 'standard', capabilities: ['chat', 'reasoning'] },
      { id: 'p1::model-b', label: 'DeepSeek', provider: 'anthropic', model: 'model-b', endpointProfileId: 'p1', contextWindow: 128000 },
    ];
    const groups = buildModelGroups(presets, EMPTY_MODEL_CATALOG);
    const noop = () => {};

    function App() {
      const [patch, setPatch] = useState(null);
      const onChange = (presetId, next) => {
        setPatch({ presetId, ...next });
        document.getElementById('patchLog').textContent = JSON.stringify({ presetId, ...next }, null, 2);
      };
      window.__ui707 = { patch };
      return React.createElement(ModelMenu, {
        mode: 'model',
        groups,
        selectedGroup: groups[0],
        activeModelId: 'p1::model-a',
        summary: { level: 'ok', text: '' },
        onClose: noop,
        onPickSupplier: noop,
        onPickModel: noop,
        onModelConfigChange: onChange,
      });
    }
    createRoot(document.getElementById('menuHost')).render(React.createElement(ThemeProvider, null, React.createElement(App)));
  </script>
</body>
</html>
