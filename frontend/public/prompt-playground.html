<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BioF3 Copilot Prompt Playground</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
  }
  .app {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .badge {
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 999px;
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }
  .panel {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 12px;
    padding: 16px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #94a3b8;
    margin: 0 0 12px 0;
  }
  .control {
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #cbd5e1;
    margin-bottom: 6px;
  }
  input[type="text"], select, textarea {
    width: 100%;
    background: #0b1220;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
    outline: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
  }
  textarea {
    resize: vertical;
    min-height: 120px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .preview {
    background: #0b1220;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 14px;
    min-height: 220px;
    white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
    color: #e2e8f0;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    background: #1d4ed8;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
  }
  button.secondary {
    background: #1e293b;
    border: 1px solid #334155;
  }
  .hint {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 8px;
  }
  .stats {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>🧬 BioF3 Copilot Prompt Playground</h1>
        <div class="hint">Compose, preview, and export system prompts for the desktop copilot stack.</div>
      </div>
      <div class="badge">Single-file playground</div>
    </header>

    <div class="grid">
      <div class="panel">
        <h2>Controls</h2>

        <div class="control">
          <label>Component target</label>
          <select id="component">
            <option value="simple-chat">SimpleChat (frontend)</option>
            <option value="copilot-markdown">CopilotMarkdown renderer</option>
            <option value="agent-runner">Agent runner (R-server)</option>
            <option value="conversations">Conversation store</option>
          </select>
        </div>

        <div class="control">
          <label>Persona</label>
          <input type="text" id="persona" value="Helpful BioF3 coding assistant" />
        </div>

        <div class="row">
          <div class="control">
            <label>Tone</label>
            <select id="tone">
              <option value="concise">Concise</option>
              <option value="balanced" selected>Balanced</option>
              <option value="verbose">Verbose</option>
            </select>
          </div>
          <div class="control">
            <label>Safety level</label>
            <select id="safety">
              <option value="standard" selected>Standard</option>
              <option value="strict">Strict</option>
              <option value="off">Off</option>
            </select>
          </div>
        </div>

        <div class="control">
          <label>Custom instructions</label>
          <textarea id="instructions" placeholder="Add domain-specific rules, output format requirements, or refusal rules...">Use short code blocks when possible. Prefer `src/` paths with line references. Never expose secrets.</textarea>
        </div>

        <div class="toolbar">
          <button id="copy">Copy prompt</button>
          <button id="download" class="secondary">Download .txt</button>
          <button id="reset" class="secondary">Reset</button>
        </div>
        <div class="stats" id="stats"></div>
      </div>

      <div class="panel">
        <h2>Live prompt preview</h2>
        <div class="preview" id="preview"></div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const preview = $('preview');
  const stats = $('stats');

  function buildPrompt() {
    const component = $('component').value;
    const persona = $('persona').value.trim() || 'Assistant';
    const tone = $('tone').value;
    const safety = $('safety').value;
    const instructions = $('instructions').value.trim();

    const toneLabel = tone === 'concise' ? 'Be concise' : tone === 'verbose' ? 'Be thorough' : 'Be clear and balanced';
    const safetyBlock = safety === 'strict'
      ? '\n## Safety\n- Do not run destructive shell commands.\n- Avoid modifying generated artifacts without confirmation.'
      : safety === 'off'
        ? '\n## Safety\n- Minimal safety restrictions for local experimentation only.'
        : '';

    const instructionsBlock = instructions ? `\n## Instructions\n${instructions}` : '';

    const text = `# ${persona}\nYou are operating as the ${component} component in the BioF3 desktop app.\n\n## Style\n- ${toneLabel}\n- Use code fences with language tags.\n- Cite relevant files when helpful.${safetyBlock}${instructionsBlock}`;

    preview.textContent = text;
    stats.textContent = `Characters: ${text.length} · Words: ${text.split(/\s+/).filter(Boolean).length}`;
    return text;
  }

  function copyPrompt() {
    const text = buildPrompt();
    navigator.clipboard.writeText(text).then(() => {
      const btn = $('copy');
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => (btn.textContent = original), 1200);
    });
  }

  function downloadPrompt() {
    const text = buildPrompt();
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `biof3-prompt-${$('component').value}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function resetControls() {
    $('component').value = 'simple-chat';
    $('persona').value = 'Helpful BioF3 coding assistant';
    $('tone').value = 'balanced';
    $('safety').value = 'standard';
    $('instructions').value = 'Use short code blocks when possible. Prefer `src/` paths with line references. Never expose secrets.';
    buildPrompt();
  }

  ['component','persona','tone','safety','instructions'].forEach(buildPrompt);
  $('copy').addEventListener('click', copyPrompt);
  $('download').addEventListener('click', downloadPrompt);
  $('reset').addEventListener('click', resetControls);
</script>
</body>
</html>
